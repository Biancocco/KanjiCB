<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字崩し</title></head><body>

<title>字崩し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400&display=swap">
<style>
/* Layout: one centered column. CPU bar and field on top, own field below, then the action panel and a scrolling hand. */
:root{
  --bg:#e6ebea; --panel:#f3f6f5; --ink:#17201f; --ink2:#566664; --line:#bdc9c7;
  --accent:#2c4a8c; --accent-ink:#ffffff;
  --card:#fbfbf6; --card-ink:#151a19; --spell:#dbe9f7; --heal:#fbe9ee; --heal2:#dff3e4; --pow:#f6d3d3; --rip:#e6dcf5;
  --good:#2f7d5b; --warn:#a86a0c; --bad:#b3372c;
  --kanji:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101619; --panel:#182126; --ink:#e4ebea; --ink2:#93a3a1; --line:#2c393e;
    --accent:#8fa8e8; --accent-ink:#0f1626;
    --card:#232d33; --card-ink:#eef2ee; --spell:#22384f; --heal:#412c35; --heal2:#25422f; --pow:#552828; --rip:#3d2f55;
    --good:#66c298; --warn:#e0a640; --bad:#ec7a6e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101619; --panel:#182126; --ink:#e4ebea; --ink2:#93a3a1; --line:#2c393e;
  --accent:#8fa8e8; --accent-ink:#0f1626;
  --card:#232d33; --card-ink:#eef2ee; --spell:#22384f; --heal:#412c35; --heal2:#25422f; --pow:#552828; --rip:#3d2f55;
  --good:#66c298; --warn:#e0a640; --bad:#ec7a6e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:8px 32px}
#app{max-width:600px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--kanji);font-weight:400;font-size:1.4rem;letter-spacing:.08em;line-height:1.1}
.top{display:none}
#board{display:flex;flex-direction:column;gap:10px;min-width:0}
.ttl .wpl{display:none}
.bl,.br{display:contents}
@media(min-width:1000px){#app{max-width:1100px}#board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;min-height:calc(100vh - 20px);align-content:start}.bl,.br{display:flex;flex-direction:column;gap:10px;min-width:0}.br{position:sticky;top:8px}.bl .field,.bl .traps{grid-template-columns:repeat(3,minmax(0,120px))}.ttl .wpl{display:inline;margin-left:1.6em;font-family:var(--kanji);letter-spacing:.06em}.npl{display:none}}

.bar{position:relative;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.bar.target{outline:3px dashed var(--bad);outline-offset:2px;cursor:pointer}
.bar .top1{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.who{font-weight:700}
.hp{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hp>i{display:block;height:100%;background:var(--good);transition:width .3s}
.hp.warn>i{background:var(--warn)}
.hp.bad>i{background:var(--bad)}
.hpn{font-variant-numeric:tabular-nums;font-size:1.1rem;min-width:2ch;text-align:right;position:relative}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.72rem;color:var(--ink2);align-items:center;font-variant-numeric:tabular-nums}
.mana{display:inline-flex;align-items:center;gap:8px}
.pips{display:inline-flex;gap:3px}
.pip{width:9px;height:14px;border-radius:2px;background:var(--line);opacity:.4}
.pip.used{background:transparent;border:1.5px solid var(--accent);opacity:.7}
.pip.on{background:var(--accent);opacity:1}
.pip.pv{background:repeating-linear-gradient(45deg,var(--accent) 0 2px,transparent 2px 4px);border:1px solid var(--accent);opacity:1}

.traps{display:grid;grid-template-columns:repeat(3,minmax(0,94px));justify-content:center;gap:8px}
.tslot{height:24px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:.7rem;opacity:.8}
.tslot.on{border-style:solid;border-color:var(--accent);color:var(--card-ink);background:var(--card);font-family:var(--kanji);font-weight:700;opacity:1}
.tslot.on[data-act]{cursor:pointer}
.atkw{color:var(--accent);font-weight:700}
.surr{border:1.5px solid var(--ink2);border-radius:4px;background:transparent;color:var(--ink);font:inherit;font-size:.78rem;padding:2px 8px;cursor:pointer;line-height:1.3}
.surr:hover{background:var(--panel)}
.tslot.selt{outline:3px solid var(--accent);outline-offset:1px}
.tslot.back{background:var(--accent);color:var(--accent-ink)}
.tslot.drop{border-style:solid;border-color:var(--acc,#b8472f);color:var(--acc,#b8472f);cursor:pointer;font-weight:700;opacity:1}
.fx-guard{animation:pop .4s}
.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot.drop{border-style:solid;border-color:var(--acc,#b8472f);color:var(--acc,#b8472f);cursor:pointer;font-weight:700}
.slot{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--ink2);font-size:.75rem}
.cw{container-type:inline-size;position:relative;aspect-ratio:3/4;min-width:0}
.card{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;background:var(--card);color:var(--card-ink);border:1.5px solid var(--line);font:inherit;padding:0;cursor:pointer;overflow:hidden;text-align:center}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.sel{outline:3px solid var(--accent);outline-offset:2px}
.card.target{outline:3px dashed var(--bad);outline-offset:2px}
.card.spc{background:var(--spell)}
.card.hl,.chip2.hl,.bdr.hl{background:var(--heal)}
.card.hg,.chip2.hg,.bdr.hg{background:var(--heal2)}
.card.hr,.chip2.hr,.bdr.hr{background:var(--pow)}
.card.hv,.chip2.hv,.bdr.hv{background:var(--rip)}
.crwn.pwb{background:#b3261e;color:#fff;font-family:inherit}
.card.dim{opacity:.55}
.card.rest .glyph{opacity:.4}
.glyph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kanji);font-size:2.6rem;font-size:54cqw;line-height:1;padding-bottom:14cqw}
.cost{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:700;display:grid;place-items:center;line-height:1}
.bst{position:absolute;right:6px;top:6px;font-size:.68rem;border:1px solid var(--ink2);color:var(--ink2);border-radius:4px;padding:0 4px;line-height:1.4}
.pt{position:absolute;left:0;right:0;bottom:7px;font-family:var(--kanji);font-size:.78rem;color:var(--ink2);letter-spacing:.1em}
.st{position:absolute;bottom:5px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.2}
.st small{font-size:.58rem;font-weight:400;margin-right:1px;color:var(--ink2)}
.st.atk{left:7px;color:var(--bad)}
.st.hpv{right:7px;color:var(--good)}
.st.hurt{color:var(--warn)}
.spl{position:absolute;left:0;right:0;bottom:6px;font-size:.7rem;font-weight:700;color:var(--ink2);text-align:center}
.tr{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.tr .row1{display:flex;gap:3px;align-items:center}
.fbd{font-size:.62rem;font-weight:700;background:var(--good);color:var(--card);border-radius:4px;padding:0 4px;line-height:1.4;white-space:nowrap}
.tr .bst{position:static}
.crwn{font-size:.62rem;font-weight:700;background:#c9a227;color:#3a2a00;border-radius:4px;padding:0 4px;line-height:1.4;font-family:var(--kanji)}
.dmg.up{color:var(--good)}
.fx-crown{animation:pop .4s}
.tag.btag{top:-12px;left:auto;right:14px;transform:none}
.tag.guard{top:auto;bottom:30px;background:var(--accent);color:var(--accent-ink);font-size:.62rem}
.tag{position:absolute;left:50%;top:34px;transform:translateX(-50%);z-index:2;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 6px;width:max-content;max-width:96%;text-align:center;line-height:1.3;pointer-events:none;font-variant-numeric:tabular-nums}
@container (max-width:90px){.pt{display:none}.glyph{font-size:50cqw}.cost{width:19px;height:19px;font-size:.72rem;left:4px;top:4px}.tr{right:4px;top:4px}.bst,.crwn,.fbd{font-size:.6rem}.st{font-size:.85rem}}
.dmg{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-weight:700;font-size:1.5rem;color:var(--bad);text-shadow:0 0 6px var(--card);pointer-events:none;animation:rise .9s ease-out forwards;z-index:3}
.dmg.face{left:auto;right:-4px;top:-14px;transform:none;font-size:1.2rem}
.fx-hit{animation:shake .35s}
.fx-spawn{animation:pop .4s}
.fx-spawn.fxy{animation:pop .4s,yglow .9s ease-out}
@keyframes yglow{0%{box-shadow:0 0 0 4px #f6e07a,0 0 22px 8px #fcf0a8}100%{box-shadow:0 0 0 3px #f6e07a,0 0 12px 3px #fcf0a8}}
@keyframes ringx{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.rays{position:absolute;inset:0;pointer-events:none;z-index:6}
.rays i{position:absolute;inset:0;border:3px solid #34c26a;border-radius:10px;box-shadow:0 0 8px #34c26a;opacity:0;animation:ringx .8s ease-out both}
.rays i+i{animation-delay:.18s}
.bar .rays i{border-radius:12px}
.cutin{position:fixed;left:0;right:0;top:36%;z-index:90;pointer-events:none;display:flex;justify-content:center;animation:cutfade 1.1s both}
.cband{width:100%;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(20,24,40,.92) 20%,rgba(20,24,40,.92) 80%,rgba(0,0,0,0));animation:cutslide 1.1s cubic-bezier(.2,.8,.2,1) both}
.clab{color:#fff;font-weight:700;letter-spacing:.2em;font-size:15px}
.cch{color:#fff;font-size:84px;line-height:1;font-weight:800;text-shadow:0 0 18px var(--accent,#5b8cff)}
.cutin.cutk{animation:cutfade 1.9s both}
.cutk .cband{animation:cutslide 1.9s cubic-bezier(.2,.8,.2,1) both}
.cstage{position:relative;width:110px;height:100px;display:inline-block;color:#fff;font-size:84px;font-weight:800;line-height:100px;text-align:center}
.cstage.salv{width:120px}
.sre{position:absolute;inset:0;font-size:84px;font-weight:800;line-height:100px;text-align:center;color:#fff;text-shadow:0 0 18px #4ad6a8,0 0 32px #4ad6a8;animation:sreIn 2.1s both}
@keyframes sreIn{0%{transform:rotateY(90deg) scale(.5);opacity:0}22%{transform:rotateY(0) scale(1.15);opacity:1}32%,100%{transform:rotateY(0) scale(1);opacity:1}}
.sring{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border:3px solid #4ad6a8;border-radius:50%;opacity:0;animation:sringx 1.1s ease-out .35s both}
.sring.r2{animation-delay:.7s}
@keyframes sringx{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.8);opacity:0}}
.sch{display:inline-flex;gap:6px;font-size:40px;color:#ffd24a;font-weight:800;text-shadow:0 0 10px #000}
.sch .sbk{width:30px;height:42px;border-radius:5px;border:2px solid #ffd24a;background:repeating-linear-gradient(45deg,#2a3a6a 0 4px,#223059 4px 8px)}
.sch span{display:inline-block;animation:schUp 2.1s both}
@keyframes schUp{0%,28%{transform:translateY(46px) scale(.6);opacity:0}48%,100%{transform:translateY(0) scale(1);opacity:1}}
.cstage.two .ca,.cstage.two .cb,.cstage.two .cr{font-size:48px}
.cstage .ca,.cstage .cb,.cstage .cr,.cstage .cp{position:absolute;inset:0;text-shadow:0 0 18px var(--accent,#5b8cff)}
.cstage .ca{clip-path:polygon(0 0,100% 0,0 100%);animation:cutA 1.9s ease-in both}
.cstage .cb{clip-path:polygon(100% 0,100% 100%,0 100%);animation:cutB 1.9s ease-in both}
.cstage .cr{opacity:0;animation:cutR 1.9s ease-out both}
.cstage .cp{font-size:28px;color:#ffd24a;opacity:0;animation:cutP 1.9s ease-in both}
.cstage .cs{position:absolute;left:-30%;right:-30%;top:50%;height:4px;margin-top:-2px;background:#fff;box-shadow:0 0 10px #fff,0 0 22px var(--accent,#5b8cff);transform:rotate(-42deg) scaleX(0);opacity:0;animation:cutS 1.9s ease-out both}
@keyframes cutS{0%,18%{transform:rotate(-42deg) scaleX(0);opacity:0}24%{transform:rotate(-42deg) scaleX(1);opacity:1}45%{transform:rotate(-42deg) scaleX(1);opacity:0}100%{opacity:0}}
@keyframes cutA{0%,26%{transform:translate(0,0);opacity:1}60%,100%{transform:translate(-26px,-22px) rotate(-8deg);opacity:0}}
@keyframes cutB{0%,26%{transform:translate(0,0);opacity:1}60%,100%{transform:translate(26px,22px) rotate(8deg);opacity:0}}
@keyframes cutR{0%,40%{opacity:0;transform:scale(.8)}62%,100%{opacity:1;transform:scale(1)}}
@keyframes cutP{0%,30%{opacity:0;transform:translate(0,0) scale(1) rotate(0)}38%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(130px,-80px) scale(.2) rotate(70deg)}}
@keyframes cutslide{0%{transform:translateX(-60%)}25%{transform:translateX(0)}80%{transform:translateX(0)}100%{transform:translateX(30%)}}
@keyframes cutfade{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes redblink{0%,100%{background-color:var(--panel)}15%,55%{background-color:#e5484d}35%,75%{background-color:var(--panel)}}
.bar.hitflash{animation:redblink .9s}
@keyframes brkblink{0%,30%,60%{background:rgba(229,72,77,.55);opacity:1}15%,45%,75%{background:rgba(229,72,77,0);opacity:1}100%{opacity:0}}
.slot.brk{border:2px solid #e5484d;color:#e5484d;font-family:var(--kanji);font-size:2.4rem;display:grid;place-items:center;animation:brkblink 1.1s both}
@keyframes pushleft{0%{transform:translateX(0)}100%{transform:translateX(-105%)}}
.hp>i.crush{transition:none;animation:pushleft .9s cubic-bezier(.6,0,.9,.4) .15s both}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes rise{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-22px}}

.mid{display:flex;flex-direction:column;gap:6px;padding:2px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hrow .ttl{margin:0}
.hrow .plan{margin:0;white-space:nowrap}
.turnno{font-size:.78rem;color:var(--ink2);font-weight:700;line-height:1}
.turnrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{font-weight:700;padding:.12em .75em;border-radius:999px;font-size:.85rem;background:var(--accent);color:var(--accent-ink)}
.chip.c{background:var(--ink2);color:var(--bg)}
.sgw{display:block;margin-top:3px;white-space:nowrap}
.tutinfo{pointer-events:none}
#coach{position:sticky;top:0;z-index:30;margin:0 0 8px}
.cmsg{background:#fffbe0;border:2px solid #f2c200;border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:.9rem;line-height:1.55;color:#2b2b2b}
.cmsg .chd{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:#7a6a00;margin-bottom:4px}
.cmsg .cdo{margin-top:6px;font-weight:700;color:#8a6d00}
#tutdim{position:fixed;inset:0;background:rgba(8,16,28,.58);z-index:20;pointer-events:none}
.tuthl{outline:4px solid #ffd21f;outline-offset:2px;animation:tutp 1.1s ease-in-out infinite}
.tuthl:not(.card){position:relative;z-index:25}
.cw.tuthlw{z-index:25}
.field{grid-template-columns:repeat(3,minmax(0,94px));justify-content:center}
.field .cw,.field .slot{aspect-ratio:4/5}
@keyframes tutp{50%{outline-color:#fff3a0}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.setg{display:inline-block;min-width:1.8em;height:1.8em;line-height:1.8em;margin-left:3px;border-radius:50%;background:#fcefa0;color:#5b4a00;font-size:.9rem;font-weight:700;text-align:center}
.card.setfx{box-shadow:0 0 0 3px #f6e07a,0 0 12px 3px #fcf0a8}
.bon{background:#fcefa0;color:#5b4a00;border-radius:5px;padding:0 4px}
.apip.bon{background:#fcefa0;border-color:#e3c94f}
.apip.bon.on{background:#f3d94e}
@keyframes atkpop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.card.atkpop{animation:atkpop .5s ease-out;position:relative;z-index:4}
.acts{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink2)}
.apip{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.apip.on{background:var(--accent)}
.log{list-style:none;margin:0;padding:0;font-size:.82rem;color:var(--ink2);display:grid;gap:1px}
.log li:first-child{color:var(--ink);font-weight:700}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:84px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.panel p{margin:0}
.panel .ttl{font-weight:700}
.panel .sm{font-size:.82rem;color:var(--ink2)}
.hintw{display:inline-block}.hintw .btn:disabled{pointer-events:none}
.panel .why{font-size:.82rem;color:var(--warn)}
.panel .plan{font-family:var(--kanji);font-size:1.05rem;letter-spacing:.08em}
.panel.alert{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.yes{background:color-mix(in srgb,var(--accent) 45%,var(--card));color:var(--card-ink);border-color:transparent}
.panel.muted{color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:520px){.row.endr{display:grid;grid-template-columns:1fr 1fr}.row.endr .btn:last-child{grid-column:1/-1;justify-self:center}}
.btn{font:inherit;font-weight:700;min-height:44px;padding:.4em 1em;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--card-ink);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lbl2{font-size:.78rem;color:var(--ink2);margin:0 0 -4px 2px}
.hand{display:flex;gap:8px;overflow-x:auto;padding:6px 8px 8px;min-height:112px}
.hand .cw{flex:0 0 76px;width:76px}
.hand .empty{color:var(--ink2);font-size:.82rem;align-self:center}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl .btn{flex:1 1 120px}

.ref{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ref summary{cursor:pointer;font-weight:700;min-height:28px}
.ref ol{margin:10px 0;padding-left:1.3em;display:grid;gap:4px;font-size:.88rem}
.gradetabs{margin-bottom:8px}
.tbl{overflow:auto;max-height:60vh}
.tbl thead th{position:sticky;top:0;background:var(--panel)}
.tbl table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.tbl th{color:var(--ink2);font-weight:400;font-size:.75rem}
.tbl td.k{font-family:var(--kanji);font-size:1.3rem}
.tbl td.k2{font-family:var(--kanji)}

[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:var(--bg);display:grid;align-items:start;justify-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));overflow:auto;z-index:10}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-block:auto}
.sheet{position:relative}
.devdot{position:absolute;top:12px;right:12px;width:18px;height:18px;padding:0;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer}
.gear{position:absolute;top:8px;right:10px;width:34px;height:34px;padding:0;border:0;background:transparent;color:var(--ink2);font-size:1.4rem;line-height:1;cursor:pointer;border-radius:8px}.rlgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}.rlrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.92rem;padding:4px 0}.rlrow select{font:inherit;padding:4px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--card-ink)}.rlrow input[type=checkbox]{width:20px;height:20px}
.gear:hover{color:var(--ink);background:var(--card)}
.devdot.on{background:var(--accent);border-color:var(--accent)}
.sheet h2{margin:0;font-family:var(--kanji);font-weight:400;font-size:2.2rem;letter-spacing:.1em;line-height:1.1}
.sheet h3{margin:0;font-size:1rem}
.sheet p{margin:0}
.sheet ol{margin:0;padding-left:1.3em;display:grid;gap:5px;font-size:.88rem}
.decks{display:grid;gap:10px}
.swrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}
.sw{width:46px;height:26px;border-radius:13px;border:1px solid var(--line);background:#b9c1bf;position:relative;padding:0;cursor:pointer;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on i{left:22px}
.deck{display:grid;gap:2px;text-align:left;padding:12px 14px;min-height:64px}
.deck b{font-family:var(--kanji);font-size:1.4rem;font-weight:400;letter-spacing:.1em}
.deck span{font-size:.82rem;font-weight:400;color:var(--ink2)}

.bd{display:flex;flex-direction:column;gap:10px}
.bdcols{display:flex;flex-direction:column;gap:10px}
.bdc1,.bdc2{display:flex;flex-direction:column;gap:10px;min-width:0}
.bdc1>*{flex-shrink:0}

.bdinfo{display:grid;gap:4px;font-size:.88rem}
.bdtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bdtop .bdf{flex-wrap:nowrap}
.bdsets{display:grid;gap:6px;margin-top:6px}
.setrow{border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:2px;font-size:.85rem}
.chip2.bonus{background:#fcefa0;border-color:#e3c94f;color:#3b3000}
.chip2.off{cursor:default;opacity:.85}
.setrow small{color:var(--ink2);font-size:.75rem}
.setrow.ok{border-color:#e3c94f;background:#fff6c2;color:#3b3000}
.setrow.ok small{color:#6b5a00}
.bdinfo .cnt{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.bdinfo .ok{color:var(--good)}.bdinfo .ng{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.chip2{font:inherit;font-family:var(--kanji);font-size:1.05rem;border:1.5px solid var(--line);background:var(--card);color:var(--card-ink);border-radius:8px;padding:2px 8px;cursor:pointer}
.chip2.spc{background:var(--spell)}
.chip2 small{font-family:var(--sans);font-size:.7rem;color:var(--ink2);margin-left:3px}

.bdf.gap{margin-top:14px}

.peek b{font-family:var(--kanji);font-size:1.1rem;font-weight:400}
.chip2.sel{outline:2px solid var(--accent);outline-offset:1px}
.mini{font:inherit;font-weight:700;min-height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--card-ink);cursor:pointer}
.mini.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mini.boxed{border:2px solid var(--ink2);border-radius:4px}
.mini:disabled{opacity:.4;cursor:not-allowed}
.bdq{font:inherit;min-height:40px;padding:0 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--card-ink);width:100%}
.bdl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bdr{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.bdr.spc{background:var(--spell)}

.bdr .c span{min-width:1.2ch;text-align:center;font-weight:700}

function syncSide(s){

   const show=gain.some(k=>k!=='te')||(gain.includes('te')&&fresh);

  {const w3=nk3?1:0,d3=w3-(ab.nk||0);

function newSide(key,n){const deck=mkDeck(key);const sets={};for(const d of SETDEF)sets[d.k]=deck.filter(c=>d.ch.has(c.ch)).length>=d.min;const hand=deck.splice(0,n);return{sets,hp:CFG.hp,deck,hand,field:[],grave:0,gy:[],mana:0,max:0,acts:0,tn:0,cw:0,traps:Array(CFG.trap).fill(null)};}
// 先攻(あなた)の最初の手札には、コスト1の字を最低1枚入れる。なければ、山札のコスト1の字と手札の1枚を入れ替える。
function ensureCost1(me){
 if(me.hand.some(c=>c.cost===1))return;
 const idx=me.deck.map((c,i)=>c.cost===1?i:-1).filter(i=>i>=0);
 if(!idx.length||!me.hand.length)return;
 const di=idx[Math.floor(rnd()*idx.length)],hi=Math.floor(rnd()*me.hand.length);
 const tmp=me.hand[hi];me.hand[hi]=me.deck[di];me.deck[di]=tmp;
}
// 後攻(CPU)の最初の手札には、コスト1か2の字を最低1枚入れる。
function ensureCheap(me){
 if(me.hand.some(c=>!c.spell&&c.cost<=2))return;
 const idx=me.deck.map((c,i)=>!c.spell&&c.cost<=2?i:-1).filter(i=>i>=0);
 if(!idx.length||!me.hand.length)return;
 const di=idx[Math.floor(rnd()*idx.length)],hi=Math.floor(rnd()*me.hand.length);
 const tmp=me.hand[hi];me.hand[hi]=me.deck[di];me.deck[di]=tmp;
}

function log(m){G.log.unshift(m);if(G.log.length>40)G.log.pop();}

function startTurn(s){
 G.cur=s;G.turn++;const me=S(s);me.tn++;me.max=Math.min(CFG.manaCap,me.tn+(s===(G.sec||'c')?CFG.secondBonus+(me.tn===1?CFG.secondOpen:0):0));me.mana=me.max;me.dr=false;me.fh=false;me.ph=false;me.ct=false;me.rp=false;me.hand.forEach(c=>{c.salv=false;});me.bk=false;me.acts=CFG.acts;me.actB=false;me.cw=0;

 if(!me.deck.length){win(OP(s),`${NAME[s]}の山札が尽きた`);return;}
 // 手札にも自分の場にも、攻撃できる字(罠・再などの特殊カード以外)が1枚もないままターンが回ってきたら、2枚引く
 const nd=(me.hand.some(c=>!c.spell&&!healerOnly(c.ch))||me.field.some(c=>!c.spell&&!healerOnly(c.ch)))?1:2;
 if(nd>1)log(`${NAME[s]}は攻撃できる字が手札にも場にもないので2枚引く`);

function dmgUnit(s,u,n){
 if(n<=0)return false;
 const me=S(s);const prev=G.fx[u.id];const eff=Math.min(n,u.hp);
 G.fx[u.id]={t:'hit',n:eff+(prev&&prev.t==='hit'?prev.n:0)};u.hp-=n;
 if(u.hp<=0){G.fx['brk'+s+u.slot]={ch:u.ch};me.field.splice(me.field.indexOf(u),1);toGy(me,u);log(`${NAME[s]}の「${u.ch}」が崩れ落ちた`);return true;}

}
function dmgFace(s,n){const me=S(s);if(n<=0)return;const hp0=me.hp;me.hp=Math.max(0,me.hp-n);const pf=G.fx['face'+s];G.fx['face'+s]={t:'hit',n:n+(pf?pf.n:0),pv:pf&&pf.pv!==undefined?pf.pv:hp0};if(me.hp<=0){G.faceKO=true;win(OP(s),`${NAME[s]}のHPが0になった`);}}

function summon(s,id,slot){
 const me=S(s);const i=me.hand.findIndex(c=>c.id===id);if(i<0||G.over||G.cur!==s)return false;
 const c=me.hand[i];if(summonWhy(s,c))return false;
 me.mana-=c.cost;me.hand.splice(i,1);c.sick=true;c.done=false;
 const used=me.field.map(x=>x.slot);let sl=0;while(used.includes(sl))sl++;if(Number.isInteger(slot)&&slot>=0&&slot<CFG.field&&!used.includes(slot))sl=slot;c.slot=sl;me.field.push(c);c.sumT=G.turn;me.lastSum=c.id;G.fx[c.id]={t:'spawn'};
 log(`${NAME[s]}は「${c.ch}」を召喚`);return true;
}
// 罠が発動するには、罠の持ち主のマナを1使う(持ち主の前のターンの残り。足りなければ発動しない)。
function trapPay(owner,ch){if(owner.mana<CFG.trapCost){log(`罠「${ch}」は、マナが足りず発動しなかった`);return false;}owner.mana-=CFG.trapCost;return true;}

function reflect(s,u,tr,slot,dm){
 const op=S(OP(s));
 if(!tr||tr.card.ch!=='返'||tr.fired||dm<=0||(op.traps||[])[slot]!==tr||!S(s).field.includes(u))return;
 if(!trapPay(op,'返'))return;
 op.traps[slot]=null;toGy(op,tr.card);addCut('返');
 log(`${NAME[OP(s)]}の罠「返」が発動し、「${u.ch}」に${dm}ダメージを返して壊れた`);

 // カットイン(1.1秒)が終わる0.4秒前に、ダメージの演出が出る
 if(G.fx[u.id])G.fx[u.id].dl=.7;{const bk=G.fx['brk'+s+u.slot];if(bk)bk.dl=.7;}
}
// 単体攻撃: 1つの標的に atk ダメージ。相手の場が空なら本体('face')のみ。
const addCut=ch=>{(G.fx.cutin=G.fx.cutin||[]).push(ch);};
function attackWhole(s,uid,tid){
 const me=S(s),op=S(OP(s)),u=me.field.find(x=>x.id===uid);if(!u||!canAct(s,u)||u.parts.length>1)return false;
 if(isHealTid(tid)){
  if(!partHeals(u.ch)||!healOk(me,tid))return false;
  healTo(s,u,u.ch,tid,healAmt(u.ch));u.done=true;me.acts--;return true;
 }
 if(healerOnly(u.ch))return false;
 if(op.field.length){
  const t=op.field.find(x=>x.id===tid);if(!t)return false;
  const red=ward(op),dm=Math.max(0,u.atk-red);G.fx['atk'+u.id]={t:'atk'};
  log(`${NAME[s]}の「${u.ch}」が「${t.ch}」を攻撃(${u.atk})`);if(red)log(`${NAME[OP(s)]}の水の守りで、ダメージが${red}減った`);
  const tr=(op.traps||[])[t.slot];
  if(tr&&tr.card.ch==='受'&&!tr.fired&&trapPay(op,'受')){
   // 受: 真上の字への単体攻撃を一度だけ無効にして、墓地へ行く

 }else{

  log(`${NAME[s]}の「${u.ch}」が直接攻撃(${u.atk})`);if(red)log(`${NAME[OP(s)]}の水の守りで、ダメージが${red}減った`);dmgFace(OP(s),Math.max(0,u.atk-red));
 }
 u.done=true;me.acts--;return true;

// 分解攻撃: パーツを順番に1つずつ、別々の標的へ攻撃させる。字は壊れず、攻撃後も1枚のまま場に残る。
// ここまでの攻撃で相手の場が空になる見込みなら、次のパーツの標的は本体('face')になる。
function splitNext(op,u,tids){
 const rem={};op.field.forEach(t=>{rem[t.id]=t.hp;});

}
// 心・りっしんべん(忄)は体力を2、幸は5回復できる。分解攻撃のパーツとして動くときと、「心」「幸」の字そのものが行動するときに、攻撃のかわりに「自分の字1枚」か「自分の本体」を選んで回復する。

function healTo(s,u,label,t,amt){

 for(const c of me.hand){if(c.spell||c.cost+CFG.discardCost>me.mana)continue;const sc=uval(c);if(sc>bs){bs=sc;bc=c;}}
 if(!bc)return null;
 let w=null,ws=1e9;for(const u of me.field){const sc=uval(u);if(sc<ws){ws=sc;w=u;}}
 return w&&bs>ws+4?w:null;
}
function aiBreak(s){
 const me=S(s),op=S(OP(s));
 if(me.bk||me.mana<CFG.breakCost||!op.field.length)return null;
 const c=me.hand.find(x=>x.ch==='壊');if(!c)return null;
 const tg=op.field.slice().sort((a,b)=>(b.cost-a.cost)||(b.hp-a.hp))[0];
 return tg.cost>=3?{c,tg}:null;
}
// 強いCPU: 通常の動きに加えて、罠の設置・花回復・力付与・切り離し・切り裂き・有料ドローを使う
function hardBoost(s){
 const me=S(s),op=S(OP(s));
 if(!me.field.length)return false;
 // 場が埋まっているか、弱い字のときだけ、手札の字を力付与・花回復に使う(強い字は召喚に回す)
 const spare=c=>me.field.length>=CFG.field||uval(c)<=7;
 // 力付与
 if(!me.ph&&me.mana>=CFG.powerCost){
  const c=me.hand.find(x=>!x.salv&&isPower(x)&&spare(x));
  if(c){
   const u=me.field.slice().sort((a,b)=>(b.atk+(b.sick?0:3))-(a.atk+(a.sick?0:3)))[0];
   let part;if(u.parts.length>1){part=u.sp.indexOf(Math.max(...u.sp));}
   if(crown(s,c.id,u.id,part))return true;
  }
 }
 // 花回復
 if(!me.fh&&me.mana>=CFG.crownCost){
  const c=me.hand.find(x=>!x.salv&&isFlower(x)&&spare(x));
  if(c){
   const dm=me.field.filter(u=>u.hp<u.max).sort((a,b)=>(b.max-b.hp)-(a.max-a.hp))[0];
   const u=dm||me.field.slice().sort((a,b)=>uval(b)-uval(a))[0];
   if(dm||me.mana>=CFG.crownCost+2){if(crown(s,c.id,u.id))return true;}
  }
 }
 return false;
}
function hardTrap(s){
 const me=S(s);
 const c=me.hand.find(x=>x.trap&&!x.salv);if(!c)return false;
 const best=me.field.slice().sort((a,b)=>uval(b)-uval(a))[0];
 let slot=-1;if(best&&best.slot>=0&&best.slot<CFG.trap&&!me.traps[best.slot])slot=best.slot;else slot=me.traps.findIndex(t=>!t);
 return slot>=0&&setTrap(s,c.id,slot);
}
function hardCut(s){
 const me=S(s),op=S(OP(s));
 if(!me.ct&&me.mana>=CFG.cutCost){
  const c=me.hand.find(x=>!x.salv&&x.ch==='刀');
  if(c){let best=null,bg=3;for(const u of op.field)for(const [part,y] of Object.entries(cutsOf(u))){const g=uval(u)-uval(mk(y));if(g>bg){bg=g;best={u,part};}}
   if(best&&cut(s,c.id,best.u.id,best.part))return true;}
 }
 if(!me.rp&&me.mana>=CFG.ripCost){
  const c=me.hand.find(x=>!x.salv&&x.ch==='裂');
  if(c){let best=null,bg=5;for(const u of op.field)ripsOf(u).forEach((r,i)=>{const g=uval(u)-uval(mk(r.to));if(g>bg){bg=g;best={u,i};}});
   if(best&&rip(s,c.id,best.u.id,best.i))return true;}
 }
 return false;
}
function aiStepHard(s){
 if(G.over)return false;
 if(G.pending)return false;
 if(hardTrap(s))return true;
 const c=aiSummon(s);if(c){summon(s,c.id);return true;}
 if(hardBoost(s))return true;
 if(hardCut(s))return true;
 const a=aiAction(s);
 if(a){if(a.k==='whole')attackWhole(s,a.u,a.t);else attackSplit(s,a.u,a.t);return true;}
 const bk=aiBreak(s);if(bk){breakUnit(s,bk.c.id,bk.tg.id);return true;}
 const d=aiDiscard(s);if(d){discard(s,d.id);return true;}
 return false;
}
function aiStep(s){
 if(G.over)return false;
 const a=aiAction(s);
 if(a){if(a.k==='whole')attackWhole(s,a.u,a.t);else attackSplit(s,a.u,a.t);return true;}
 const c=aiSummon(s);if(c){summon(s,c.id);return true;}
 const bk=aiBreak(s);if(bk){breakUnit(s,bk.c.id,bk.tg.id);return true;}
 const d=aiDiscard(s);if(d){discard(s,d.id);return true;}
 return false;
}

// 字の出入りがありうる操作の最後に、部首ボーナスを反映し直す。
['startTurn','summon','attackWhole','attackSplit','breakUnit','resolveCounter','compose','cut','rip','crown','discard','setTrap'].forEach(n=>{
 const f=globalThis[n];if(typeof f!=='function')return;
 globalThis[n]=function(...a){const r=f.apply(this,a);syncAll();return r;};
});
</script>

<script id="ui">
const $=id=>document.getElementById(id);
// 二人対戦では、手番の人(または罠「返」で壊す字を選ぶ人)が画面の下側。一人対戦では、あなた('p')が下側。
let seenSide=null;
let ONLINE=null;
const ME=()=>ONLINE?ONLINE.side:(G&&G.two)?(G.pending?G.pending.by:G.cur):'p';
const FOE=()=>OP(ME());
const mineTurn=()=>ONLINE?(G.pending?G.pending.by===ONLINE.side:G.cur===ONLINE.side):(G&&G.two)?true:G.cur==='p';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let ui={sel:null,mode:null,split:null};
const resetUi=()=>{ui={sel:null,mode:null,split:null};};
// 相手の場が空になる見込みなら、残りのパーツの標的は本体に決まるので自動で入れる
// 相手の本体を狙えるときも、自動では決めず、本体の枠を押して選ぶ。
function autoFace(){
 const c=splitCtx();
 if(c&&c.done&&ui.sel&&ui.split){attackSplit(ME(),ui.sel.id,ui.split.tids);resetUi();render();afterAction();return true;}
 return false;
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// いま回復を選べるときの回復量(0なら選べない)。分解攻撃で回復パーツの番か、回復できる単体の字(心・幸)が単体攻撃を選んだとき。
const healNow=()=>{
 const c=splitCtx();
 if(c){return c.done?0:healAmt(c.su.parts[ui.split.tids.length]);}
 if(ui.mode==='whole'&&ui.sel&&ui.sel.kind==='field'){const u=S(ME()).field.find(x=>x.id===ui.sel.id);if(u&&u.parts.length<2)return healAmt(u.ch);}
 return 0;
};
const nextHeal=()=>!!healNow();
const isHealCard=c=>c.parts.some(partHeals)||partHeals(c.ch);
const planTxt=u=>u.parts.map((p,i)=>p+u.sp[i]).join(' + ');
function splitCtx(){
 if(ui.mode!=='split'||!ui.split||!ui.sel||ui.sel.kind!=='field')return null;
 const su=S(ME()).field.find(x=>x.id===ui.sel.id);if(!su)return null;
 return{su,pr:splitNext(S(FOE()),su,ui.split.tids),done:ui.split.tids.length>=su.parts.length};
}

const RAYS='<span class="rays" aria-hidden="true"><i></i><i></i></span>';
function cardH(u,kind,cls,tag,gtag){
 const fx=G.fx[u.id];
 const fxc=fx?' fx-'+fx.t+(fx.y?' fxy':''):'';
 const dly=fx&&fx.dl?` style="animation-delay:${fx.dl}s"`:'';
 const dmg=fx&&fx.t==='hit'&&fx.n?`<span class="dmg"${dly?` style="animation-delay:${fx.dl}s;animation-fill-mode:both"`:''}>-${fx.n}</span>`:fx&&fx.t==='crown'&&fx.n?`<span class="dmg up">+${fx.n}</span>`:'';
 const multi=u.parts.length>1;
 const hurt=u.hp<u.max?' hurt':'';
 const owner=G.side.p.field.includes(u)?'p':G.side.c.field.includes(u)?'c':null;
 const sfx=owner&&SETDEF.some(d=>setOn(S(owner),d.k)&&(d.k!=='te'||u.sumT===G.turn))?' setfx':'';
 const apx=G.fx['atk'+u.id]?' atkpop':'';
 const bh=u.ab&&u.ab.hp>0,ba=u.ab&&(u.ab.atk>0||u.ab.nk>0);
 const hpv=u.hp<u.max?`${u.hp}<small>/${u.max}</small>`:u.hp;
 const hpTxt=kind==='hand'?u.hp:(bh?`<b class="bon">${hpv}</b>`:hpv);
 return `<div class="cw"><button type="button"${dly} class="card ${cls||''}${u.spell?' spc':''}${!u.spell&&(u.ch==='裂'||u.ch==='刀')?' hv':!u.spell&&isPower(u)?' hr':!u.spell&&isFlower(u)?' hl hg':!u.spell&&isHealCard(u)?' hl':''}${fxc}${sfx}${apx}" data-kind="${kind}" data-id="${u.id}" aria-label="${u.ch} コスト${u.cost} 攻撃${u.atk} 体力${u.hp}">`+
  `<span class="cost">${u.cost}</span>${(multi||u.pow||u.fmax)?`<span class="tr">${(u.pow||multi)?`<span class="row1">${u.pow?`<span class="crwn pwb" title="力付与で攻撃力+${u.pow}">力+${u.pow}</span>`:''}${multi?'<span class="bst">分</span>':''}</span>`:''}${u.fmax?`<span class="fbd" title="花回復で最大体力+${u.fmax}">花+${u.fmax}</span>`:''}</span>`:''}`+
  `<span class="glyph">${u.ch}</span>${multi?`<span class="pt">${u.parts.join('')}</span>`:''}`+
  (u.spell?`<span class="spl">${esc(u.label||'特殊')}</span>`:`<span class="st atk">${healerOnly(u.ch)?`<small>回復</small>${healAmt(u.ch)}`:`<small>攻</small>${ba?`<b class="bon">${u.atk}</b>`:u.atk}`}</span><span class="st hpv${hurt}"><small>体</small>${hpTxt}</span>`)+`</button>${tag?`<span class="tag">${esc(tag)}</span>`:''}${gtag?`<span class="tag guard">${esc(gtag)}</span>`:''}${dmg}${fx&&fx.heal?RAYS:''}</div>`;
}
function fieldH(s){
 const f=S(s).field;let h='';
 f.forEach((x,k)=>{if(!(x.slot>=0))x.slot=k;});
 const aiming=(ui.mode==='whole'||ui.mode==='split')&&mineTurn()&&!(ui.mode==='whole'&&nextHeal()&&(()=>{const su=S(ME()).field.find(x=>x.id===ui.sel.id);return su&&healerOnly(su.ch);})());
 const tags={},htags={};const ctx=splitCtx();
 if(ctx)ctx.su.parts.forEach((p,i)=>{if(i<ui.split.tids.length){const k=ui.split.tids[i];if(typeof k==='string'&&k.startsWith('h:'))(htags[Number(k.slice(2))]=htags[Number(k.slice(2))]||[]).push(p+'回復');else(tags[k]=tags[k]||[]).push(p+ctx.su.sp[i]);}});
 const healing=s===ME()&&mineTurn()&&nextHeal();
 for(let i=0;i<CFG.field;i++){
  const u=f.find(x=>x.slot===i);
  if(!u){
   const bx=G.fx['brk'+s+i];if(bx){h+=`<div class="slot brk" aria-hidden="true"${bx.dl?` style="animation-delay:${bx.dl}s"`:''}>${esc(bx.ch)}</div>`;continue;}
   if(s===ME()){
    const ok=mineTurn()&&ui.sel&&ui.sel.kind==='hand'&&(()=>{const c=S(ME()).hand.find(x=>x.id===ui.sel.id);return c&&!summonWhy(ME(),c);})();
    h+=ok?`<div class="slot drop" data-act="slot" data-slot="${i}" role="button" tabindex="0" aria-label="${i+1}番目の枠に召喚">ここに召喚</div>`:'<div class="slot">空き</div>';
   }else h+='<div class="slot">空き</div>';
   continue;
  }
  let cls='';
  if(s===ME()){
   if(ui.sel&&ui.sel.kind==='field'&&ui.sel.id===u.id)cls+=' sel';
   if(u.sick||u.done)cls+=' rest';
   if(ui.mode==='crown'&&ui.sel&&ui.sel.kind==='hand')cls+=' target';
   if(healing)cls+=' target';
   if(ui.mode==='trapset'&&ui.sel&&ui.sel.kind==='hand'&&!(S(ME()).traps||[])[u.slot])cls+=' target';
   if(ui.mode==='compose'&&ui.sel&&ui.sel.kind==='hand'){const hc=S(ME()).hand.find(x=>x.id===ui.sel.id);if(hc&&composeTo(hc.ch,u.ch))cls+=' target';else cls+=' dim';}
  }else{
   const dead=!!(ctx&&ctx.pr.rem[u.id]<=0);
   if(aiming&&!dead&&!(ctx&&ctx.done))cls+=' target';
   if((G.pending&&G.pending.by===ME())||(ui.mode==='break'&&ui.sel&&ui.sel.kind==='hand'&&mineTurn()))cls+=' target';
   if(dead)cls+=' dim';
   if(ui.sel&&ui.sel.kind==='enemy'&&ui.sel.id===u.id)cls+=' sel';
   if(ui.mode==='cut'&&ui.sel&&ui.sel.kind==='hand'){cls+=Object.keys(cutsOf(u)).length?' target':' dim';if(ui.cut&&ui.cut.uid===u.id)cls+=' sel';}
   if(ui.mode==='rip'&&ui.sel&&ui.sel.kind==='hand'){cls+=ripsOf(u).length?' target':' dim';if(ui.rip&&ui.rip.uid===u.id)cls+=' sel';}
  }
  const tg=s!==ME()?((tags[u.id]||[]).join(' ')).trim():((htags[u.id]||[]).join(' ')).trim();
  const gt0=(S(s).traps||[])[u.slot];
  const gtg=gt0&&gt0.card.ch==='止'&&gt0.fired&&gt0.blocked&&gt0.blocked.length?`止 ${gt0.blocked.join(' ')} 無効`:'';
  h+=cardH(u,s===ME()?'field':'enemy',cls,tg,gtg);
 }
 return h;
}
function barH(s){
 const me=S(s);const pct=Math.max(0,me.hp/CFG.hp*100);const cls=pct<=25?'bad':pct<=50?'warn':'';
 const fx=G.fx['face'+s];const d=fx&&fx.n?(fx.t==='heal'?`<span class="dmg face up">+${fx.n}</span>`:`<span class="dmg face">-${fx.n}</span>`):'';
 const pips=Array.from({length:CFG.manaCap},(_,i)=>`<i class="pip ${i<me.mana?'on':i<me.max?'used':''}"></i>`).join('');
 const cx=splitCtx();
 const hoSel=ui.mode==='whole'&&ui.sel&&ui.sel.kind==='field'&&(()=>{const su=S(ME()).field.find(x=>x.id===ui.sel.id);return !!(su&&healerOnly(su.ch));})();
 const aiming=s!==ME()&&mineTurn()&&((ui.mode==='whole'&&!S(FOE()).field.length&&!hoSel)||!!(cx&&!cx.done&&cx.pr.face));
 const healAim=s===ME()&&mineTurn()&&nextHeal();
 const hft=(s===ME()&&cx)?cx.su.parts.filter((p,i)=>ui.split.tids[i]==='hf').map(p=>p+'回復').join(' '):'';
 return `<div class="bar ${aiming||healAim?'target':''}${fx&&fx.t==='hit'?' hitflash':''}" ${aiming?'data-act="face" role="button" tabindex="0" aria-label="相手本体を狙う"':healAim?'data-act="healface" role="button" tabindex="0" aria-label="自分の本体を回復"':''}>`+
  `${fx&&fx.heal?RAYS:''}${hft?`<span class="tag btag">${esc(hft)}</span>`:''}<div class="top1"${s===FOE()?' style="grid-template-columns:auto 1fr auto auto"':''}><span class="who">${NAME[s]}</span><div class="hp ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="${CFG.hp}" aria-valuenow="${me.hp}"><i${me.hp<=0&&fx&&fx.t==='hit'?' class="crush"':''} style="width:${me.hp<=0&&fx&&fx.t==='hit'?Math.min(100,(fx.pv||0)/CFG.hp*100):pct}%"></i></div><b class="hpn">${me.hp}${d}${SETDEF.some(d0=>setOn(me,d0.k))?`<span class="sgw">${SETDEF.filter(d0=>setOn(me,d0.k)).map(d0=>`<span class="setg" title="${d0.lab}: ${d0.txt}">${d0.lab}</span>`).join('')}</span>`:''}</b>${s===FOE()?'<button type="button" class="surr" data-act="surrender" aria-label="降参する">降参</button>':''}</div>`+
  `<div class="meta"><span class="mana"><span>マナ ${me.mana}/${me.max}</span><span class="pips">${pips}</span></span><span>山札 ${me.deck.length}</span><span>手札 ${me.hand.length}</span><span>墓地 ${me.grave}</span></div></div>`;
}
function midH(){
 const who=G.two?NAME[G.cur]+'の番':mineTurn()?'あなたの番':'CPUの番';
 const a=G.cur?S(G.cur).acts:0;
 const pips=Array.from({length:CFG.acts+((G.cur&&S(G.cur).actB)?1:0)},(_,i)=>`<i class="apip ${i<a?'on':''}${i>=CFG.acts?' bon':''}"></i>`).join('');
 const tno=G.cur?S(G.cur).tn:0;
 return `<div class="mid">${tno?`<div class="turnno">${tno}ターン目</div>`:''}<div class="turnrow"><span class="chip ${G.cur||'p'}">${who}</span><span class="acts">行動 ${pips}</span></div></div>`;
}
function unitWhy(u){
 const P=S(ME());
 if(u.sick)return '出したばかりで動けません';
 if(u.done)return 'このターンは行動済みです';
 if(P.acts<=0)return '行動回数がありません';
 return '';
}
const hlAtk=t=>esc(t).replace(/(単体攻撃|分解攻撃)/g,'<b class="atkw">$1</b>');
const TRAP_TXT={'止':'その真上の字が分解攻撃を受けたとき発動し、その分解攻撃(1文字ぶん)のパーツの攻撃をすべて無効にします。その分解攻撃で相手の本体へ向かうパーツも、すべて止まります。そのあと「止」は壊れます。発動には、持ち主のマナ'+CFG.trapCost+'(前のターンの残り)が必要で、足りないと発動しません。','受':'その真上の字が単体攻撃を受けたとき発動し、そのダメージを一度だけ無効にします(使うと墓地へ)。または、その真上の字が「壊」に狙われたとき発動し、その字と一緒に消える代わりに、相手の場の字を1枚壊します(相手の場が空なら本体に5ダメージ)。壊す字が「受」を持っていても効きません。発動には、持ち主のマナ'+CFG.trapCost+'(前のターンの残り)が必要で、足りないと発動しません。','返':'その真上の字が攻撃を受けたとき発動し、受けたダメージと同じダメージを、攻撃してきた字に与えます。ダメージを与えたあと「返」は壊れます(分解攻撃ならパーツ1つぶんが対象)。発動には、持ち主のマナ'+CFG.trapCost+'(前のターンの残り)が必要で、足りないと発動しません。'};
function panelH(){
 if(G.pending&&G.pending.by===ME())return '<div class="panel alert"><p class="ttl">罠「受」が発動しました。</p><p>相手の場の字を1枚選んで壊してください。</p></div>';
 if(!mineTurn())return `<div class="panel muted"><p>${ONLINE?'相手が操作しています…':'CPUが考えています…'}</p></div>`;
 if(ui.confirmEnd)return '<div class="panel alert"><p class="ttl">まだ攻撃していません。</p><p>ターン終了しますか?</p><div class="row"><button type="button" class="btn yes" data-act="endyes">はい</button><button type="button" class="btn" data-act="endno">いいえ</button></div></div>';
 const P=S(ME()),E=S(FOE());
 if(ui.sel&&ui.sel.kind==='trap'){
  const tr=(P.traps||[])[ui.sel.slot];
  if(tr){
   const above=P.field.find(u=>u.slot===ui.sel.slot);
   return `<div class="panel"><p class="ttl">罠「${tr.card.ch}」 ${tr.fired?'(発動中)':'(伏せ中)'}</p><p class="sm">${hlAtk(TRAP_TXT[tr.card.ch]||'')}</p><div class="row" style="align-items:center;justify-content:space-between;gap:8px"><p class="sm" style="margin:0">${above?`この罠の真上の字: 「${esc(above.ch)}」`:'この罠の真上には、いま字がありません。'}</p><button type="button" class="btn" data-act="cancel">閉じる</button></div></div>`;
  }
 }
 if(ui.sel&&ui.sel.kind==='hand'){
  const c=P.hand.find(x=>x.id===ui.sel.id);
  if(c&&c.salv&&!ui.mode){const why=summonWhy(ME(),c);return `<div class="panel"><p class="ttl">「${c.ch}」 ${CARDS[c.ch].s}画 / コスト ${c.cost}</p><p class="sm">墓地から戻したので、このターンは召喚だけできます。花回復・力付与・切り離しなどは次のターンからです。</p>${why?`<p class="why">${why}</p>`:''}<div class="row">${c.spell?'':`<button type="button" class="btn pri" data-act="summon" ${why?'disabled':''}>召喚する</button>`}<button type="button" class="btn" data-act="cancel">やめる</button></div></div>`;}
  if(c&&ui.mode==='salv'&&ui.salv){
   const sv=ui.salv,el=salvElig(ME()),need=Math.min(CFG.salvTake,el.length);
   if(sv.dis.length<CFG.salvDiscard){
    return `<div class="panel"><p class="ttl">墓地回収: 「再」</p><p>捨てる手札を${CFG.salvDiscard}枚選んでください(${sv.dis.length}/${CFG.salvDiscard})。</p><div class="row"><button type="button" class="btn" data-act="cancel">やめる</button></div></div>`;
   }
   const btns=el.map(x=>`<button type="button" class="btn ${sv.take.includes(x.id)?'pri':''}" data-act="salvtake" data-id="${x.id}" aria-pressed="${sv.take.includes(x.id)}">${x.ch}(${CARDS[x.ch].c})</button>`).join('');
   return `<div class="panel"><p class="ttl">墓地回収: 「再」</p><p>墓地から手札に加える字を${need}枚選んでください(${sv.take.length}/${need})。</p><div class="row">${btns}</div><div class="row"><button type="button" class="btn pri" data-act="dosalv" ${sv.take.length===need?'':'disabled'}>回収する</button><button type="button" class="btn" data-act="salvback">捨て直す</button><button type="button" class="btn" data-act="cancel">やめる</button></div></div>`;

 if(act==='freediscard'&&ui.sel&&ui.sel.kind==='hand'){freeDiscard(ME(),ui.sel.id);resetUi();render();return;}
 if(act==='salvmode'&&ui.sel&&ui.sel.kind==='hand'){ui.mode='salv';ui.salv={dis:[],take:[]};render();return;}
 if(act==='salvback'&&ui.salv){ui.salv.dis=[];ui.salv.take=[];render();return;}
 if(act==='salvtake'&&ui.salv){
  const id=Number(data&&data.id),need=Math.min(CFG.salvTake,salvElig(ME()).length),k=ui.salv.take.indexOf(id);
  if(k>=0)ui.salv.take.splice(k,1);else if(ui.salv.take.length<need)ui.salv.take.push(id);
  render();return;}
 if(act==='dosalv'&&ui.salv&&ui.sel&&ui.sel.kind==='hand'){salvage(ME(),ui.sel.id,ui.salv.dis,ui.salv.take);resetUi();render();return;}
 if(act==='cutmode'&&ui.sel&&ui.sel.kind==='hand'){ui.mode='cut';ui.cut=null;render();return;}
 if(act==='cutpart'&&ui.mode==='cut'&&ui.sel&&ui.sel.kind==='hand'&&ui.cut){cut(ME(),ui.sel.id,ui.cut.uid,data&&data.part);resetUi();render();return;}
 if(act==='ripmode'&&ui.sel&&ui.sel.kind==='hand'){ui.mode='rip';ui.rip=null;render();return;}
 if(act==='rippart'&&ui.mode==='rip'&&ui.sel&&ui.sel.kind==='hand'&&ui.rip){rip(ME(),ui.sel.id,ui.rip.uid,Number(data&&data.i));resetUi();render();return;}
 if(act==='compose'&&ui.sel&&ui.sel.kind==='hand'){ui.mode='compose';render();return;}
 if(act==='crown'&&ui.sel&&ui.sel.kind==='hand'){ui.mode='crown';render();return;}
 if(act==='slot'&&ui.sel&&ui.sel.kind==='hand'){summon(ME(),ui.sel.id,Number(data&&data.slot));resetUi();render();return;}
 if(act==='whole'&&ui.sel&&ui.sel.kind==='field'){ui.mode='whole';ui.split=null;render();return;}
 if(act==='split'&&ui.sel&&ui.sel.kind==='field'){ui.mode='split';ui.split={tids:[]};autoFace();render();return;}
 if(act==='discard'&&ui.sel&&ui.sel.kind==='field'){discard(ME(),ui.sel.id);resetUi();render();return;}
 if(act==='dodiscard'&&ui.sel&&ui.sel.kind==='field'){discard(ME(),ui.sel.id);resetUi();render();return;}
 if(act==='undo'&&ui.split){
  const t=ui.split.tids;if(!t.length)return;
  t.pop();render();return;}
 if(act==='dosplit'&&ui.sel&&ui.split){attackSplit(ME(),ui.sel.id,ui.split.tids);resetUi();render();afterAction();return;}
 if(act==='healface'){
  if(ui.mode==='split'&&ui.split&&nextHeal()){ui.split.tids.push('hf');if(autoFace())return;render();}
  else if(ui.mode==='whole'&&nextHeal())performWhole('hf');
  return;
 }
 if(act==='face'){
  if(ui.mode==='whole'&&!S(FOE()).field.length){const su=S(ME()).field.find(x=>x.id===ui.sel.id);if(!(su&&healerOnly(su.ch)))performWhole('face');return;}
  const cx=splitCtx();
  if(cx&&!cx.done&&cx.pr.face){ui.split.tids.push('face');if(autoFace())return;render();}
  return;
 }
 if(act==='pdraw'){paidDraw(ME());resetUi();render();return;}
 if(act==='end'){
  if(S(ME()).acts>0&&S(ME()).field.some(u=>!u.sick&&!u.done)){resetUi();ui.confirmEnd=true;render();return;}
  endPlayerTurn();return;
 }
 if(act==='endyes'){endPlayerTurn();return;}
 if(act==='endno'){resetUi();render();return;}
}
function doTwoEnd(){resetUi();startTurn(OP(G.cur));render();if(G.over)showEnd();}
async function endPlayerTurn(){
 if(G.two){const snd=ONLINE&&!ONLINE.replay;doTwoEnd();if(snd)ONLINE.send({t:'end',chk:netChk()});return;}
 resetUi();startTurn('c');render();
 if(G.over){showEnd();return;}
 await runCpu();
}
async function runCpu(){
 if(TUT){await tutCpu();return;}
 const gid=G.gid;
 await wait(750);
 let n=0;
 while(G.gid===gid&&!G.over&&n++<30){
  const did=(G.lv==='hard'?aiStepHard('c'):aiStep('c'));render();
  while(G.pending&&G.gid===gid&&!G.over)await wait(300);
  if(!did)break;
  await wait(900);
 }
 if(G.gid!==gid)return;
 if(G.over){showEnd();return;}
 log('CPUはターンを終えた');
 await wait(350);
 startTurn('p');resetUi();render();
 if(G.over)showEnd();
}

 <li>破棄: 自分の場の字を1枚、墓地へ送れる。場が埋まったとき、弱い字を手放して強い字と入れ替えるために使う。</li>

 <li><b>力付与</b>: 「力」「勝」「功」「攻」「勢」「努」「勇」は、手札から使って自分の場の字1枚の攻撃力を${CFG.powerAtk}増やせる(分解攻撃を持つ字は、好きなパーツ1つの攻撃力が${CFG.powerAtk}増える)。マナ${CFG.powerCost}とその字を消費し、行動回数は使わない。1ターンに1回だけ。付与された字には「力」の印が付く。</li>
 <li><b>花回復</b>: くさかんむり(艹)を含み、草にまつわる漢字は手札から使って自分の場の字1枚の体力を3回復できる。満タンを超える分は、その分だけ最大体力が増える。マナ${CFG.crownCost}とその字を消費し、1ターンに1回だけ使える。</li>
 <li><b>ドロー</b>: マナ${CFG.drawCost}を払って1枚引ける。1ターンに1回だけで、行動回数は使わない(手札が満杯のときと山札がないときは使えない)。</li>
 <li><b>墓地</b>: 倒された字、破棄した字、手札から使った字、手札があふれて捨てた札は、持ち主の墓地に置かれる。墓地は持ち主ごとに別で、相手の墓地は使えない。</li>
 <li><b>壊</b>: 攻撃も召喚もできない特殊カード。手札から使い、「壊」とマナ${CFG.breakCost}を払って、相手の場の字を1枚壊す。1ターンに1回、行動回数は使わない。</li>
 <li><b>受(罠)</b>: 罠の枠に伏せる罠カード。真上の字が<b class="atkw">単体攻撃</b>を受けたときは、そのダメージを一度だけ無効にして墓地へ行く。真上の字が「壊」に狙われたときは、その字と一緒に消える代わりに、壊した側の場の字を1枚壊す(壊す字が「受」を持っていても効かない)。壊した側の場に字がなければ、本体に${CFG.counterDmg}ダメージ。</li>
 <li><b>返(罠)</b>: 罠の枠に伏せる罠カード。真上の字が攻撃を受けたとき、受けたダメージと同じダメージを、攻撃してきた字に与える。ダメージを与えたあと「返」は壊れる。発動にはマナ${CFG.trapCost}が必要。</li>

 <li><b>止(罠)</b>: 攻撃も召喚もできない罠カード。手札から「罠設置」で、罠の空き枠へ無償で伏せる(真上に字がなくてもよい。相手には裏向きで見える)。置いた枠の真上の字が<b class="atkw">分解攻撃</b>を受けると発動し、その分解攻撃(1文字ぶん)のパーツの攻撃をすべて無効にして、そのあと止は壊れる。<b class="atkw">単体攻撃</b>は止められない。</li>
 <li>「再」は、手札から無償で破棄できる。</li>

 <li><b>切り離し</b>: 手札の「刀」を使い、相手の場の字から切り離せるパーツを1つ選んで、別の字に変える(例: 「森」から「木」を切って「林」に、「明」から「日」を切って「月」に)。切り離したあとの形が、単体の字か、ほかの字のパーツ構成と一致する字が対象(花→化、字→子、森→林など)。偏(亻・扌など)が残るときは、その字(人・手など)に変わる。マナ${CFG.cutCost}を使い、1ターンに1回だけで、行動回数は使わない。受けたダメージ・力付与・花回復の分は引き継ぐ。</li>
 <li>罠の枠が自分と相手に${CFG.trap}つずつある。枠の位置は、場の字の枠と同じ列に対応する。</li>

 <li>手札の字を選ぶと空き枠に「ここに召喚」と出る。押した枠に召喚できる。</li>
 <li>分解できるのは、パーツがすべて「単体で常用漢字になる字」か「その字自身の部首」で、1画のパーツを含まず、字そのものが部首ではない字だけ。それ以外の字は単体攻撃だけ。さんずい(氵)は「水」として分解できる。分解しても字は壊れず、攻撃後も元の字のまま場に残る。体力は字ごとに1つ。同じパーツなら、攻撃力はどの字の中でも同じ(木は常に2)。</li>
 <li><b>回復するパーツ</b>: 「心」とりっしんべん(忄)は体力を2、「幸」は5回復できる。分解攻撃でそのパーツが動くとき、または「心」「幸」の字そのものが行動するときに、自分の場の字1枚か自分の本体を選んで回復できる。「心」「幸」の字そのものは攻撃できず、回復だけができる。分解攻撃のパーツのときは、相手を攻撃するかわりに回復できる(本体の体力は${CFG.hp}まで、字は最大体力まで)。回復できる字は、背景が淡いピンク色になる。</li>

 </ol>`;

function netIn(i,m){
 if(!ONLINE){if(net.idle&&net.idle.i===i&&m&&typeof m==='object')idleRecv(m);return;}
 if(ONLINE.brk!==i||!m||typeof m!=='object')return;
 ONLINE.last=Date.now();
 if(m.t==='bye'){netPeerLeft();return;}
 if(m.g!=null&&m.g!==ONLINE.ep)return;
 if(m.n!=null){if(m.n<=ONLINE.rn)return;ONLINE.rn=m.n;}
 netRecv(m);
}
function netLeave(){
 const mq=net.mq,was=!!ONLINE;net.idle=null;
 try{if(ONLINE&&ONLINE.started)ONLINE.raw({t:'bye'});}catch(x){}
 net.mq=[];net.role='';ONLINE=null;
 if(net.wait){clearTimeout(net.wait);net.wait=null;}
 if(net.hi){clearInterval(net.hi);net.hi=null;}
 if(net.pingIv){clearInterval(net.pingIv);net.pingIv=null;}
 mq.forEach(e=>{try{e.cl&&e.cl.end(false);}catch(x){}});
 if(was){RNG=null;NAME.p='あなた';NAME.c='CPU';G=null;}
}
function netFail(msg){netLeave();showNetMenu(msg);}
function netClosed(force){
 if(!ONLINE)return;
 if(ONLINE.started&&G&&G.two&&!G.over){netPeerLeft('相手からの応答が30秒以上ありません。通信が切れたため、対戦を終了してメニューに戻りました。');return;}
 if(!G||!G.over)netFail('相手との接続が切れました。');
}
async function netTest(){
 const out=['テスト中…(約10秒)'];
 const show=()=>showOverlay(`<h2>通信テスト <small style="font-size:.6rem;font-weight:400">${APP_VER}</small></h2><p style="white-space:pre-wrap;font-size:.85rem;font-family:monospace">${esc(out.join('\n'))}</p><div class="row"><button type="button" class="btn" data-net="open">もどる</button></div>`);
 show();
 try{await netLoadLib();out.length=0;out.push('ライブラリ読み込み: OK');}catch(e){out.length=0;out.push('ライブラリ読み込み: 失敗(cdn.jsdelivr.netに接続できません)');show();return;}
 show();
 const tid='jkzkcb/v1/test/'+Math.random().toString(36).slice(2);
 const res=await Promise.all(NET_BROKERS.map(url=>new Promise(done=>{
  const t0=Date.now();let cl;let fin=false;
  const end=(txt)=>{if(fin)return;fin=true;try{cl&&cl.end(true);}catch(x){}done(url.replace(/^wss:\/\//,'').replace(/[:\/].*$/,'')+': '+txt);};
  try{
   cl=window.mqtt.connect(url,Object.assign({clientId:'jkzt_'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:0},NET_AUTH(url)));
   cl.on('connect',()=>{cl.subscribe(tid,{qos:1},err=>{if(err)return end('購読失敗');cl.publish(tid,'x',{qos:1});});});
   cl.on('message',()=>end('OK('+(Date.now()-t0)+'ms)'));
   cl.on('error',e=>end('失敗('+((e&&e.message)||'error')+')'));
  }catch(e){end('失敗');}
  setTimeout(()=>end('失敗(時間切れ)'),10000);
 })));
 res.forEach(r=>out.push(r));
 out.push(res.some(r=>/: OK/.test(r))?'→ 1つ以上OKなので、オンライン対戦できます。':'→ すべて失敗。この回線では使えません。');
 out.push('(この画面をそのまま教えてください)');show();
}
function netCode(){return Array.from({length:5},()=>NET_ABC[Math.floor(Math.random()*NET_ABC.length)]).join('');}
async function netHost(){
 netIdleEnd();
 showNetWait('通信の準備をしています…');
 try{await netLoadLib();}catch(e){showNetMenu('通信ライブラリを読み込めませんでした。ネットワークを確認してください。');return;}
 net.role='host';net.code=netCode();let shown=false;
 netConnectAll('h',(i,m)=>{
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){
   if(!ONLINE){
    const seed=Math.floor(Math.random()*2147483647),hostFirst=Math.random()<.5,hostSpec=netDeckSpec(net.deck);
    net.startMsg={t:'start',seed,hostFirst,hostSpec,guestSpec:m.deck,rules:Object.assign({},ruleCfg)};
    netMakeOnline(i);ONLINE.raw(net.startMsg);
    if(net.wait){clearTimeout(net.wait);net.wait=null;}
    netBegin(seed,hostFirst,hostSpec,m.deck,net.startMsg.rules);
   }else if(ONLINE.brk===i&&net.startMsg){ONLINE.raw(net.startMsg);}
   return;
  }
  netIn(i,m);
 },()=>{if(!shown&&!ONLINE){shown=true;showNetWait('相手が入るのを待っています…',net.code);}});
 net.wait=setTimeout(()=>{if(!shown)netFail('通信サーバーにつながりませんでした。「通信テスト」で確認してください。');},12000);
}
async function netJoin(code){
 netIdleEnd();
 code=String(code||'').normalize('NFKC').replace(/\s/g,'').toUpperCase();
 if(code.length<5){showNetMenu('合言葉は5文字です。');return;}
 showNetWait('部屋に入っています…');
 try{await netLoadLib();}catch(e){showNetMenu('通信ライブラリを読み込めませんでした。ネットワークを確認してください。');return;}
 net.role='guest';net.code=code;
 netConnectAll('g',(i,m)=>{
  if(!m||typeof m!=='object')return;
  if(m.t==='start'&&!ONLINE){
   if(net.hi){clearInterval(net.hi);net.hi=null;}
   if(net.wait){clearTimeout(net.wait);net.wait=null;}
   netMakeOnline(i);netBegin(m.seed,m.hostFirst,m.hostSpec,m.guestSpec,m.rules);
   return;
  }
  netIn(i,m);
 });
 const hello=()=>{if(ONLINE)return;const o={t:'hello',deck:netDeckSpec(net.deck)};net.mq.forEach((e,i)=>{if(e.ready)netPub(i,'h',o);});};
 net.hi=setInterval(hello,2000);setTimeout(hello,800);
 net.wait=setTimeout(()=>netFail('その合言葉の部屋が見つかりません。合言葉が合っているか、相手が部屋を作って待っているかを確かめてください。'),25000);
}
function netRecv(m){
 if(!m||typeof m!=='object')return;
 if(!ONLINE)return;
 if(m.t==='rematch'){ONLINE.peerRematch=true;if(ONLINE.myRematch&&net.role==='host')netRestart();else if(G&&G.over&&$('ov').hidden)showRematchBanner(()=>netRematchPress(),()=>{if(ONLINE){ONLINE.peerRematch=false;ONLINE.raw({t:'decline'});}});else netRematchNote();return;}
 if(m.t==='decline'){if(ONLINE.rt){clearTimeout(ONLINE.rt);ONLINE.rt=null;}ONLINE.myRematch=false;showOverlay('<h2>再戦</h2><p>相手が再戦を断りました。</p><div class="row"><button type="button" class="btn pri" data-act="tomenu">メニューに戻る</button></div>');return;}
 if(m.t==='restart'&&net.role==='guest'){netResetCtr();netBegin(m.seed,m.hostFirst,m.hostSpec,m.guestSpec,m.rules);return;}
 if(!ONLINE.started||!G||!G.two||G.over)return;
 const peerSide=OP(ONLINE.side);
 if(m.t==='surrender'){G.over=ONLINE.side;G.why='相手が降参したので、あなたの勝ちです';resetUi();render();showEnd();return;}
 if(m.t!=='act'&&m.t!=='end')return;
 if((G.pending?G.pending.by:G.cur)!==peerSide)return;
 ONLINE.replay=true;
 try{
  if(m.t==='act'){if(!NET_FNS.includes(m.fn)||!Array.isArray(m.args))return;window[m.fn](...m.args);}
  else{if(G.pending||G.cur!==peerSide)return;doTwoEnd();}
 }finally{ONLINE.replay=false;}
 resetUi();render();if(G.over)showEnd();
 if(m.chk&&m.chk!==netChk()){
  const w=document.createElement('div');w.setAttribute('role','alert');w.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#fee;color:#900;border:2px solid #c33;border-radius:8px;padding:8px;font-size:.85rem';w.textContent='盤面が相手とずれた可能性があります。対戦をやり直してください。';document.body.appendChild(w);setTimeout(()=>w.remove(),8000);
 }
}
function netBegin(seed,hostFirst,hostSpec,guestSpec,rules){
 net.specs={hostSpec,guestSpec};net.rules=rules||null;
 {const br=document.getElementById('backres');if(br)br.remove();}
 const iHost=net.role==='host';
 const side=(iHost===hostFirst)?'p':'c';
 ONLINE.side=side;ONLINE.started=true;ONLINE.ep=seed;
 const pk=netDeckKey(hostFirst?hostSpec:guestSpec,'net_p'),ck=netDeckKey(hostFirst?guestSpec:hostSpec,'net_c');
 NAME[side]='あなた';NAME[OP(side)]='相手';
 RNG=mulberry32(seed);UID=0;applyRulesObj(net.rules);
 newGame(pk,ck);G.two=true;resetUi();$('ov').hidden=true;
 startTurn('p');render();
}
function netClick(b){
 const a=b.dataset.net;
 if(a==='open'){net.deck='';showNetMenu();return;}
 if(a==='back'||a==='cancel'){netLeave();showStart();return;}
 if(a==='pick'){const k=b.dataset.key;if(!DECKS[k]||(isCustomKey(k)&&!customOk(k)))return;deckWarn(k,()=>{net.deck=k;showNetMenu();},()=>showNetMenu());return;}
 if(a==='test'){netTest();return;}
 if(!net.deck)return;
 if(a==='host'){netHost();return;}
 if(a==='join'){const el=document.getElementById('netcode');
  const cd=String(el?el.value:'').normalize('NFKC').replace(/\s/g,'');
  if(cd.length<5){const w=document.getElementById('netwarn');if(w)w.hidden=false;return;}
  netJoin(cd);return;}
}

function boot(data){
 if(data&&data.G){
  G=data.G;UID=data.UID;GID=data.GID;ui=data.ui||ui;if(G.two){NAME.p='プレイヤー1';NAME.c='プレイヤー2';}
  render();
  if(G.over)showEnd();else if(G.cur==='c'&&!G.two)runCpu();
 }else{showStart();}
}
try{window.claude?.hot?.snapshot?.(()=>ONLINE?{}:({G,UID,GID,ui}));}catch(e){}
try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});}catch(e){boot({});}
</script>
